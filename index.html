<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->

    <meta
      name="description"
      content="Premium Digital Agency providing Web Design, SEO, and Hosting for local businesses. Restaurants, Salons, and Clinics specialized."
    />
    <link rel="canonical" href="https://kalpixa.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Kalpixa Web Studio" />
    <meta property="og:url" content="https://kalpixa.com/" />
    <meta property="og:title" content="Kalpixa Web Studio | Digital Transformation" />
    <meta
      property="og:description"
      content="We build stunning, high-performance websites that bring you customers. Web Design, SEO, and Hosting."
    />
    <meta property="og:image" content="https://kalpixa.com/og-image.jpg" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://kalpixa.com/" />
    <meta property="twitter:title" content="Kalpixa Web Studio | Digital Transformation" />
    <meta
      property="twitter:description"
      content="We build stunning, high-performance websites that bring you customers."
    />
    <meta property="twitter:image" content="https://kalpixa.com/og-image.jpg" />
    <meta property="twitter:site" content="@kalpixa" />

    <!-- Performance: Fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
    <link rel="dns-prefetch" href="https://fonts.gstatic.com" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-EXZQVCT7BQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-EXZQVCT7BQ', { anonymize_ip: true, send_page_view: true });
    </script>
  <link rel="stylesheet" href="/src/index.css">
</head>

  <body class="bg-slate-950 text-white font-sans antialiased">
    <!--
      Netlify Form Detection
      This hidden form allows Netlify to detect fields during the build process.
    -->
    <form
      name="contact"
      method="POST"
      data-netlify="true"
      data-netlify-honeypot="bot-field"
      hidden
    >
      <input type="hidden" name="form-name" value="contact" />
      <p hidden>
        <label>Don't fill this out: <input name="bot-field" /></label>
      </p>
      <input type="text" name="name" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <select name="service"></select>
      <textarea name="message"></textarea>
    </form>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
