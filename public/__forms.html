<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Kalpixa form definition</title></head>
  <body>
    <form name="contact" method="POST" action="/thank-you/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact">
      <input name="name"><input name="company"><input name="email" type="email"><input name="phone"><input name="website" type="url">
      <select name="service"><option>Website &amp; Platform</option><option>SEO &amp; Content</option><option>Digital Marketing</option><option>E-Commerce</option><option>Analytics &amp; Tracking</option><option>Other</option></select>
      <select name="timeline"><option>Within 4 weeks</option><option>1–3 months</option><option>3–6 months</option><option>Exploring</option></select>
      <select name="budget"><option>Under ₹50,000</option><option>₹50,000–₹1,50,000</option><option>₹1,50,000–₹5,00,000</option><option>₹5,00,000+</option><option>Not sure</option></select>
      <textarea name="message"></textarea><input name="consent"><input name="bot-field">
    </form>
  </body>
</html>
