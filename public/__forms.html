<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><title>Kalpixa form definition</title></head>
  <body>
    <form name="contact" method="POST" action="/thank-you/" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="contact">
      <input name="name"><input name="email" type="email"><input name="phone">
      <select name="service"><option>Website</option><option>SEO</option><option>Ecommerce</option><option>Other</option></select>
      <textarea name="message"></textarea><input name="consent"><input name="bot-field">
    </form>
  </body>
</html>
