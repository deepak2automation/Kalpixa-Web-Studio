name: Release quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    # Official v1.63.0-noble image: update this digest with @playwright/test.
    # Preinstalled browsers avoid downloading 180+ OS packages on every run.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --shm-size=1g
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run release:check
        env:
          # The runner owns the bind mount; use the authoritative CI revision.
          COMMIT_REF: ${{ github.sha }}
      - name: Verify preinstalled browser executables
        run: node --input-type=module -e "import { existsSync } from 'node:fs'; import { chromium, firefox, webkit } from 'playwright'; for (const browser of [chromium, firefox, webkit]) { if (!existsSync(browser.executablePath())) throw new Error('The browser image must match the pinned Playwright package.'); }"
      - run: npm run test:browser
      - name: Retain browser evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-evidence
          path: .qa-artifacts/
          include-hidden-files: true
          retention-days: 14
