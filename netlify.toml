
# SPA fallback: allow refresh / direct open on /services, /contact, etc.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cache static assets for better Lighthouse performance
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.(png|jpg|jpeg|webp|svg|woff|woff2|ttf|eot)"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
